# Enable only after the domain points to this VPS and the certificate is issued.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nms.bandokios.com;
    ssl_certificate /etc/letsencrypt/live/nms.bandokios.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nms.bandokios.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host nms.bandokios.com;
        proxy_set_header X-Nocx-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
