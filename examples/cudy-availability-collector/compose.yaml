services:
  nocx-cudy-collector:
    build: .
    container_name: nocx-cudy-collector
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    environment:
      NOCX_ENDPOINT: ${NOCX_ENDPOINT}
      NOCX_COLLECTOR_TOKEN: ${NOCX_COLLECTOR_TOKEN}
      SITES_BYPASS_TOKEN: ${SITES_BYPASS_TOKEN}
      TARGET_IP: 10.66.66.3
      DEVICE_ID: device-cudy-lt400-pilot
      COLLECTOR_ID: collector-doxa-vps
      WG_INTERFACE: wg0
      INTERVAL_SECONDS: 30
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=1m,mode=1777
